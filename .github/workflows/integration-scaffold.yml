name: Integration scaffold checks

on:
  pull_request:
  push:
    paths:
      - 'integration/**'
      - 'tools/check_integration_artifacts.py'
      - 'tools/check_integration_offline_boundary.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Encrypted dashboard accounts and audit log (2026-11-12, phase 1b): AES-256-GCM.
      - run: python -m pip install --disable-pip-version-check "cryptography==46.0.7"
      - run: python -m unittest discover -s integration/tests -t . -v
      - run: python tools/check_integration_artifacts.py
      - run: python tools/check_integration_offline_boundary.py
