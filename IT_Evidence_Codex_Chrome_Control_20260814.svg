  <text x="140" y="300" fill="#f0f6fc" font-family="Cascadia Mono, Consolas, monospace" font-size="29">node_repl kernel exited unexpectedly</text>
  <text x="140" y="375" fill="#8b949e" font-family="Cascadia Mono, Consolas, monospace" font-size="27">node_repl diagnostics: {</text>
  <text x="185" y="425" fill="#8b949e" font-family="Cascadia Mono, Consolas, monospace" font-size="27">&quot;kernel_pid&quot;: 27780,</text>
