  <text x="185" y="665" fill="#8b949e" font-family="Cascadia Mono, Consolas, monospace" font-size="27">&quot;stream_error&quot;: null }</text>
  <text x="100" y="790" fill="#d29922" font-family="Segoe UI, Arial, sans-serif" font-size="23">Note: This is a rendered evidence capture of the raw diagnostic, not a native desktop or Chrome screenshot.</text>
